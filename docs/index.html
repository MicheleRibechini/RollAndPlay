<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll &amp; Play</title>
<style>
:root{--paper:#f3f2ef;--ink:#1b1f27;--soft:#5a6270;--line:#c9cdd3;--accent:#6b1d27}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:56px 20px 80px}
h1{font:700 clamp(2rem,8vw,3rem)/1.1 Georgia,"Times New Roman",serif;margin:0 0 .2em;letter-spacing:.02em}
.sub{color:var(--soft);margin:0 0 40px}
ul{list-style:none;padding:0;margin:0}
li{border-top:1px solid var(--line)}
li:last-child{border-bottom:1px solid var(--line)}
a{display:block;padding:18px 4px;color:inherit;text-decoration:none}
a:hover .name,a:focus-visible .name{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.name{display:block;font:700 1.5rem/1.2 Georgia,"Times New Roman",serif}
.desc{display:block;color:var(--soft);font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
<h1>Roll &amp; Play</h1>
<p class="sub">Scegli il setting.</p>
<ul>
<li><a href="drustvar/"><span class="name">Drustvar</span><span class="desc">Manuale di campagna</span></a></li>
</ul>
</div>
</body>
</html>
